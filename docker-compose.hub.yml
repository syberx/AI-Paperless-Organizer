# Docker Compose für Docker Hub Images (wie ein neuer User)
services:
  backend:
    image: webdienste/ai-paperless-organizer:backend-latest
    container_name: paperless-organizer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/organizer.db
    restart: unless-stopped
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - paperless-organizer-net

  frontend:
    image: webdienste/ai-paperless-organizer:frontend-latest
    container_name: paperless-organizer-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - paperless-organizer-net

networks:
  paperless-organizer-net:
    driver: bridge

